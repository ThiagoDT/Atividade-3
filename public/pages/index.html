<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <link rel="icon" href="https://www.cps.sp.gov.br/favicon.ico">
        <link rel="stylesheet" href="/assets/css/main.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>DSM - Cadastro</title>
    </head>
    <body>
        <main class="card">
            <h1 class="title">Cadastro de Usuarios</h1>
            <input class="user-input" id="user-nome" placeholder="Digite o nome do usuario"/>
            <input class="user-input" id="user-email" placeholder="Digite o e-mail" type="email"/>
            <div class="actions">
                <button class="action-button action-button-primary">Salvar</button>
                <button class= "action-button action-button-secondary">Limpar</button>
            </div>
            <section class="user-list">
                <table class="user-table">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body"></tbody>
                </table>
            </section>
        </main> 
        <script src="/assets/js/main.js">
        </script>
    </body>
</html>
